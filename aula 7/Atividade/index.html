<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/global.css">
    <script src="scripts/index.js" defer></script>

    <title>Cadastro de Animes</title>
</head>
<body>
    <header>
        <h1>Catálogo Otaku</h1>
    </header>
    <main>
        <h2>Cadastro de Animes</h2>
        
        <form id="cadastro" novalidate onsubmit="executar(event)">
            <label for="titulo">Título do Anime*</label>
            <input type="text" id="titulo" placeholder="Ex: Fullmetal Alchemist: Brotherhood">
            <p id="erro-titulo" class="oculto"></p>

            <label for="genero">Gênero Principal*</label>
            <select id="genero">
                <option value="">Selecione um gênero...</option>
                <option value="acao">Ação / Shonen</option>
                <option value="aventura">Aventura / Isekai</option>
                <option value="romance">Romance / Slice of Life</option>
                <option value="suspense">Suspense / Seinen</option>
                <option value="fantasia">Fantasia</option>
            </select>
            <p id="erro-genero" class="oculto"></p>

            <label for="episodios">Quantidade de Episódios*</label>
            <input type="number" id="episodios" min="1" placeholder="Ex: 64">
            <p id="erro-episodios" class="oculto"></p>

            <label for="nota">Sua Nota (0 a 10)*</label>
            <input type="number" id="nota" min="0" max="10" step="0.5" placeholder="Ex: 9.5">
            <p id="erro-nota" class="oculto"></p>

            <label for="status">Status*</label>
            <select id="status">
                <option value="">Selecione o status...</option>
                <option value="assistindo">Assistindo</option>
                <option value="concluido">Concluído</option>
                <option value="planejo">Planejo Assistir</option>
                <option value="dropado">Abandonado (Dropado)</option>
            </select>
            <p id="erro-status" class="oculto"></p>

            <label>
                <input type="checkbox" id="recomendado">
                Recomendo este anime para outras pessoas
            </label>
            <p id="erro-recomendado" class="oculto"></p>

            <!-- O type="submit" evita conflito com o onsubmit do form -->
            <button type="submit">Cadastrar Anime</button>
            <p id="concluido" class="oculto"></p>
        </form>
    </main>
    <footer>
        <p>Projeto para conhecermos o JavaScript</p>
    </footer>
</body>
</html>
